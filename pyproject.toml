[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puma"
version = "3.1.0"
description = "Local, reproducible benchmarking of open LLMs on project management tasks"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psutil>=5.9",
    "codecarbon>=2.4",
    "streamlit>=1.35",
    "langdetect>=1.0.9",
    "structlog>=24.1",
    "rich>=13.7",
    "pyfiglet>=1.0",
    "requests>=2.31",
    "jsonschema>=4.23.0",
    "tomli-w>=1.0.0",
    "PyGithub>=2.4,<3",
    "gradio-client>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff==0.15.12",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
puma = "puma.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    "src/cleanup.py",
    "src/data_prep.py",
    "src/evaluate_estimation.py",
    "src/evaluate_triage.py",
    "agents/",
    "scripts/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "PT011", "RUF012", "SIM117", "SIM118", "PT018", "UP038", "RUF002"]
"alembic/versions/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
# Re-enabled in Phase 5 once the CI gate runs full-scope mypy on src/puma/.
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/versions/", "scripts/"]

[[tool.mypy.overrides]]
module = ["puma.metrics.*", "puma.runtime.*", "puma.preflight.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: Integration tests that require data files",
    "unit: Unit tests for individual functions",
    "slow: Tests that take longer to run",
    "ollama: Tests that require Ollama running",
    "smoke: End-to-end smoke tests",
    "requires_gpu: Tests that require an NVIDIA GPU passthrough into the runner container",
    "e2e: end-to-end integration tests (runs full pipeline against real Ollama; slow but high-signal)",
]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]
