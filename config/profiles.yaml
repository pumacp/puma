# PUMA Hardware Execution Profiles
# Each profile defines hardware-resource thresholds and enabled scenarios.
# Per B.1.3, the per-profile model list is no longer maintained here:
# `puma.preflight.catalog.models_for_profile(<name>)` derives it dynamically
# from `config/models_catalog.yaml.profiles_compatible[]`.
# See INDEX.md §2.1 for rationale.

profiles:
  cpu-lite:
    description: "Minimal CPU-only profile for 8 GB RAM machines"
    requirements:
      min_ram_gb: 8
      gpu_required: false
      min_disk_gb: 10
    scenarios:
      - triage_jira

  cpu-standard:
    description: "Standard CPU-only profile for 16 GB RAM machines"
    requirements:
      min_ram_gb: 16
      gpu_required: false
      min_disk_gb: 25
    scenarios:
      - triage_jira
      - estimation_tawos

  gpu-entry:
    description: "Entry GPU profile — 6-8 GB VRAM"
    requirements:
      min_ram_gb: 16
      gpu_required: true
      min_vram_gb: 6
      min_disk_gb: 35
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira

  gpu-mid:
    description: "Mid GPU profile — 12-16 GB VRAM"
    requirements:
      min_ram_gb: 16
      gpu_required: true
      min_vram_gb: 12
      min_disk_gb: 60
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira

  gpu-high:
    description: "High-end GPU profile — 24 GB+ VRAM"
    requirements:
      min_ram_gb: 32
      gpu_required: true
      min_vram_gb: 24
      min_disk_gb: 100
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira

  # Apple Silicon profiles (NEW in v2.6.0).
  #
  # All apple-silicon-* entries are empirically unvalidated as of v2.6.0:
  # PUMA has no Mac hardware in the validation set. The profile dispatch
  # selects them when sysctl reports the matching chip brand. Empirical
  # validation (F1/MAE/latency/energy) on each chip variant is deferred
  # until hardware becomes available.
  #
  # The requirements schema is extended additively (non-breaking) with:
  #   apple_silicon_required:  bool   — gates this profile to macOS arm64.
  #   chip_brand_match:        str    — exact match of
  #                                     `sysctl -n machdep.cpu.brand_string`.
  #   min_unified_memory_gb:   int    — lower bound of the chip variant's
  #                                     typical unified-memory configuration.
  # Existing fields (min_ram_gb, gpu_required, min_vram_gb, min_disk_gb)
  # remain valid; for Apple Silicon profiles the GPU lives in unified
  # memory rather than discrete VRAM, so min_vram_gb is 0 and
  # gpu_required is false (no discrete GPU is required by the schema —
  # Metal acceleration is delivered by the unified memory architecture).

  apple-silicon-m3:
    description: "Apple M3 base, 8-24 GB unified memory (released 2023-10)"
    requirements:
      min_ram_gb: 8
      gpu_required: false
      min_vram_gb: 0
      min_disk_gb: 35
      apple_silicon_required: true
      chip_brand_match: "Apple M3"
      min_unified_memory_gb: 8
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira
    empirical_validation: pending
    runtime_mode_recommended: native

  apple-silicon-m3-pro:
    description: "Apple M3 Pro, 18-36 GB unified memory (released 2023-10)"
    requirements:
      min_ram_gb: 18
      gpu_required: false
      min_vram_gb: 0
      min_disk_gb: 60
      apple_silicon_required: true
      chip_brand_match: "Apple M3 Pro"
      min_unified_memory_gb: 18
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira
    empirical_validation: pending
    runtime_mode_recommended: native

  apple-silicon-m3-max:
