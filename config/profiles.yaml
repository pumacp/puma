# PUMA Hardware Execution Profiles
# Each profile defines hardware-resource thresholds and enabled scenarios.
# Per B.1.3, the per-profile model list is no longer maintained here:
# `puma.preflight.catalog.models_for_profile(<name>)` derives it dynamically
# from `config/models_catalog.yaml.profiles_compatible[]`.
# See INDEX.md §2.1 for rationale.

profiles:
  cpu-lite:
    description: "Minimal CPU-only profile for 8 GB RAM machines"
    requirements:
      min_ram_gb: 8
      gpu_required: false
      min_disk_gb: 10
    scenarios:
      - triage_jira

  cpu-standard:
    description: "Standard CPU-only profile for 16 GB RAM machines"
    requirements:
      min_ram_gb: 16
      gpu_required: false
      min_disk_gb: 25
    scenarios:
      - triage_jira
      - estimation_tawos

  gpu-entry:
    description: "Entry GPU profile — 6-8 GB VRAM"
    requirements:
      min_ram_gb: 16
      gpu_required: true
      min_vram_gb: 6
      min_disk_gb: 35
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira

  gpu-mid:
    description: "Mid GPU profile — 12-16 GB VRAM"
    requirements:
      min_ram_gb: 16
      gpu_required: true
      min_vram_gb: 12
      min_disk_gb: 60
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira

  gpu-high:
    description: "High-end GPU profile — 24 GB+ VRAM"
    requirements:
      min_ram_gb: 32
      gpu_required: true
      min_vram_gb: 24
      min_disk_gb: 100
    scenarios:
      - triage_jira
      - estimation_tawos
      - prioritization_jira
