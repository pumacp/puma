  - ollama_tag: "gemma4:e2b"
    params_b: 2.0
    gguf_size_gb: 7.2  # was 2.0; corrected after verifying actual GGUF on disk (2026-05-10).
                       # GGUF contains all MoE experts; effective params are 2B but full
                       # file includes inactive experts.
    context_window: 262144
    logprobs_supported: true
    profiles_compatible: [cpu-standard, gpu-mid, gpu-high]
    timeout_s: 120
    notes: "Gemma4 MoE; effective params ~2B (active per forward), full GGUF includes
            all experts (~7.2 GB); 256K context.
            Excluded from gpu-entry (D18): requires VRAM headroom; CPU offload on
            <12 GB VRAM produces tokens non-decodable by Ollama detokenizer for
            structured prompts (evidence: B.3 sweep parse_failure_rate 0.98-1.00;
            raw_response='' confirmed in S2.2 inspection)."

