name: Publish Docker image to GHCR

# Builds the image on every run. Pushes to ghcr.io/pumacp/puma only on a `v*`
# tag push; a manual run builds without pushing (push=false). Uses only the
# auto-provided GITHUB_TOKEN with packages:write.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/pumacp/puma
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/pumacp/puma
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://pumacp.github.io/puma
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.publish
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
