name: Publish Docker image to GHCR

# Builds the image on every run. Pushes to ghcr.io/pumacp/puma only on a `v*`
# tag push; a manual run builds without pushing (push=false). Uses only the
# auto-provided GITHUB_TOKEN with packages:write.
#
# S12-N2 (security audit MVP): after the build, the image is scanned with
# Trivy for HIGH/CRITICAL OS and library CVEs. The build step loads the
# image into the local Docker daemon (load: true) so the scanner can
# address it by tag; the push step then re-runs against the same content
# and is short-circuited by the buildx cache. SARIF output is uploaded to
# the GitHub Security tab. The scan fails the workflow on any HIGH or
# CRITICAL finding — the publish step does not run when the scan fails.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/pumacp/puma
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/pumacp/puma
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://pumacp.github.io/puma

      - name: Build the image locally for scanning
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.publish
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the built image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/pumacp/puma:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to the GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Push the scanned image to GHCR
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.publish
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
