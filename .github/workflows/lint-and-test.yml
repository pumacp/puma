name: Lint and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: this workflow only lints and runs tests; it needs no
# write access to repository contents or any other scope.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src/puma/ tests/

      - name: Ruff format check
        run: ruff format --check src/puma/ tests/

      - name: Type-check full PUMA codebase (strict)
        # SCOPE: src/puma/ (entire package). The 5-phase mypy remediation
        # documented in docs/maintenance/baseline-2026-05.md brought the
        # codebase from 104 errors to 0. This gate locks in the clean state.
        env:
          PYTHONPATH: src
        run: mypy src/puma/

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/unit/ -q --no-header --tb=short

      - name: Integration tests
        env:
          PYTHONPATH: src
        run: pytest tests/integration/ -q --no-header --tb=short -m "not ollama"

  integration-tests-ollama:
    name: Integration tests with Ollama
    runs-on: ubuntu-latest
    # Only run on push to main/develop, not on PRs — installing Ollama and
    # pulling a model is too expensive for every PR push. The job exists to
    # catch Ollama-side regressions on the integration branches.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 30
    # Non-blocking for PR merges (different trigger). Failures here are
    # surfaced via the workflow run page and notify the maintainers without
    # gating the merge queue.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama daemon
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

      - name: Wait for Ollama API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Ollama API did not respond within 30s"
          cat /tmp/ollama.log
          exit 1

      - name: Pull required models (qwen2.5:1.5b + qwen2.5:3b)
        # test_runner_ece.py hardcodes qwen2.5:1.5b; test_runtime_ollama.py
        # defaults to qwen2.5:3b via LLM_MODEL env. Both must be present
        # locally before the ollama-marked tests run, otherwise Ollama
        # returns 404 on /api/generate for the missing tag.
        run: |
          ollama pull qwen2.5:1.5b
          ollama pull qwen2.5:3b
          ollama list

      - name: Run ollama-marked tests
        env:
          PYTHONPATH: src
          OLLAMA_HOST: http://localhost:11434
          PUMA_OLLAMA_HOST: http://localhost:11434
        timeout-minutes: 15
        run: pytest tests/ -m ollama -v --no-cov --tb=short
