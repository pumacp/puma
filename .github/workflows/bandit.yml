name: bandit

# Python SAST scan against src/puma/. The -ll flag surfaces MEDIUM and
# HIGH severity issues in the output; the bandit step exits non-zero on
# any HIGH-severity finding via -l (its severity-level threshold).
# Tests (tests/) are excluded — bandit's defaults flag assert statements
# as B101, which is the canonical test idiom and would generate noise.
#
# Cadence: every push to develop / main, every PR, manual dispatch.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install --upgrade pip bandit

      - name: Run bandit against src/puma/
        run: bandit -r src/puma/ -ll
