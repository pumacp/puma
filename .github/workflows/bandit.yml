name: bandit

# Python SAST scan against src/puma/, as documented in docs/security.md:
# MEDIUM and higher findings are reported, and only HIGH fails the build.
# Step 1 runs with -ll (MEDIUM+) and --exit-zero so the findings are visible
# in the log without failing the job; step 2 runs with -lll so any HIGH
# finding makes the job fail. Tests (tests/) are excluded — bandit's defaults
# flag assert statements as B101, which is the canonical test idiom and
# would generate noise.
#
# Cadence: every push to develop / main, every PR, manual dispatch.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install --upgrade pip bandit

      - name: Report MEDIUM and higher findings (never fails)
        run: bandit -r src/puma/ -ll --exit-zero

      - name: Fail on HIGH findings
        run: bandit -r src/puma/ -lll
